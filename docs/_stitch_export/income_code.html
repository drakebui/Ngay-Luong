<body class="bg-background text-on-background min-h-screen flex flex-col font-sans antialiased selection:bg-primary-fixed selection:text-on-primary-fixed">
<!-- TopAppBar JSON Translation -->

</div>
<!-- Headline / Brand -->
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-black text-primary dark:text-inverse-primary tracking-tighter absolute left-1/2 -translate-x-1/2">
            Ngày Lương
        </h1>
<!-- Trailing Icon -->
<button class="flex items-center justify-center w-10 h-10 rounded-full text-on-surface-variant hover:bg-surface-container-high transition-colors shrink-0">
<span class="material-symbols-outlined text-[24px]" data-icon="settings">settings</span>
</button>

<!-- Main Content Canvas -->
<!-- Navigation Bottom shell is suppressed here because this is a transactional "Setup" focus screen -->
<main class="flex-grow flex flex-col items-center w-full max-w-lg mx-auto px-margin-mobile md:px-0 py-lg gap-lg">
<!-- Header Section -->
<section class="text-center w-full flex flex-col gap-sm">
<h2 class="font-headline-xl text-headline-xl text-primary px-sm">Thiết lập thu nhập của bạn</h2>
<p class="font-body-md text-body-md text-on-surface-variant max-w-sm mx-auto">Thông tin này chỉ dùng để tính toán giá trị thời gian của bạn.</p>
</section>
<!-- Form Section -->
<section class="w-full flex flex-col gap-md">
<!-- Input Group: Monthly Income -->
<div class="flex flex-col gap-xs group">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider ml-sm group-focus-within:text-primary transition-colors">THU NHẬP HÀNG THÁNG</label>
<div class="relative flex items-center">
<input class="w-full bg-surface-container-low border border-outline-variant rounded-xl px-md py-4 font-body-lg text-body-lg text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition-all shadow-sm group-focus-within:shadow-md" inputmode="numeric" type="text" value="25.000.000"/>
<span class="absolute right-md font-body-lg text-body-lg text-outline">₫</span>
</div>
</div>
<!-- Grid for Days and Hours -->
<div class="grid grid-cols-2 gap-md">
<!-- Input Group: Days per month -->
<div class="flex flex-col gap-xs group">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider ml-sm group-focus-within:text-primary transition-colors">SỐ NGÀY LÀM VIỆC/THÁNG</label>
<div class="relative flex items-center">
<input class="w-full bg-surface-container-low border border-outline-variant rounded-xl px-md py-4 font-body-lg text-body-lg text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition-all shadow-sm group-focus-within:shadow-md" type="number" value="22"/>
<span class="absolute right-md font-body-lg text-body-lg text-outline">ngày</span>
</div>
</div>
<!-- Input Group: Hours per day -->
<div class="flex flex-col gap-xs group">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider ml-sm group-focus-within:text-primary transition-colors">SỐ GIỜ LÀM VIỆC/NGÀY</label>
<div class="relative flex items-center">
<input class="w-full bg-surface-container-low border border-outline-variant rounded-xl px-md py-4 font-body-lg text-body-lg text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition-all shadow-sm group-focus-within:shadow-md" type="number" value="8"/>
<span class="absolute right-md font-body-lg text-body-lg text-outline">giờ</span>
</div>
</div>
</div>

<div class="relative bg-primary-container rounded-xl p-[32px] overflow-hidden shadow-[0_8px_32px_rgba(1,45,29,0.15)] border border-primary/20 flex flex-col items-center justify-center text-center group transition-transform duration-300 hover:scale-[1.02]">

</button>

<script>
        // Lightweight interaction: formatting number inputs (simple demo)
        const inputs = document.querySelectorAll('input[type="text"][inputmode="numeric"]');
        inputs.forEach(input => {
            input.addEventListener('blur', function(e) {
                // Strip non-digits
                let value = this.value.replace(/\D/g, '');
                if(value) {
                    // Format with dots
                    this.value = parseInt(value, 10).toLocaleString('vi-VN');
                }
            });
        });
    </script>
