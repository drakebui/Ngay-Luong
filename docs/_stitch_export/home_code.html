<style>

<body class="bg-surface-container-low text-on-background font-body-md min-h-screen flex flex-col relative antialiased">
<!-- TopAppBar -->
<header class="flex justify-between items-center w-full px-6 py-4 sticky top-0 z-50 bg-surface/80 backdrop-blur-xl transition-all duration-300" id="top-bar">
<!-- Leading Avatar -->
<div class="w-10 h-10 rounded-full bg-secondary-container flex items-center justify-center text-on-secondary-container shadow-sm border border-secondary-container/50">
<span class="material-symbols-outlined text-lg" data-icon="person">person</span>
</div>
<!-- Headline -->
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-black text-primary tracking-tighter select-none">
            Ngày Lương
        </h1>
<!-- Trailing Icon -->
<button class="w-10 h-10 rounded-full flex items-center justify-center text-primary hover:bg-surface-container-high transition-colors focus:outline-none focus:ring-2 focus:ring-primary/20">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 px-6 pt-2 pb-32 flex flex-col gap-8 max-w-lg mx-auto w-full">
<!-- Hero Card (Bento Grid Style) -->
<section class="relative w-full h-56 rounded-3xl overflow-hidden shadow-sm border border-outline-variant/30 group animate-fade-in-up">
<!-- Background Image -->
<div class="absolute inset-0 bg-cover bg-center transition-transform duration-700 group-hover:scale-105" data-alt="A minimalist flat-lay photograph of a pristine white desk setup bathed in soft morning light. The composition features abstract geometric shapes in muted sage greens, a sleek metallic pen, and subtle shadows from a nearby plant. The overall mood is calm, organized, and focused on future planning, perfectly matching a premium light-mode corporate aesthetic." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCFKQ0wDaQs7EZm6cMkB3SEtHfaqGvwzXdyIdf1Yqmbj6mtn_mG-EjP7aZGYeBlLBSmEGvVXSptrgKozcdHpT70ZzG_f8qwatJrPftEJPDvYSAcTDBnjsqcImU18NM9arQiGF9mWUXo4-3enP6KFb1Qm5nR0ECdrUHl6XFI1uem8Rihi1vpwBgk4mVeHQuO9ZeosWQ8sjm4VqU9GAP5MScpFdGAJrJdSsqqRfbNhm39lFtXImUJkLRcfjfNelbABP4zoHjAaX-YJPf7');">
</div>
<!-- Glassmorphism Gradient Overlay -->
<div class="absolute inset-0 bg-gradient-to-t from-primary/90 via-primary/40 to-transparent"></div>
<!-- Content -->
<div class="absolute bottom-0 left-0 p-6 w-full">
<div class="inline-flex items-center gap-1.5 bg-surface/20 backdrop-blur-md px-3 py-1 rounded-full border border-surface/30 mb-3">
<span class="material-symbols-outlined text-xs text-on-primary" data-icon="auto_awesome" data-weight="fill" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
<span class="font-label-sm text-label-sm text-on-primary uppercase tracking-widest">Mục tiêu mới</span>
</div>
<h2 class="font-headline-md text-headline-md text-on-primary tracking-tight">Xây dựng tương lai</h2>
</div>
</section>
<!-- Input Forms Area -->
<section class="flex flex-col gap-6 w-full">
<!-- Text Input: Goal -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface-variant ml-2" for="goal-input">Mục tiêu của bạn</label>
<div class="relative group">
<input class="w-full bg-surface-container-lowest border border-outline-variant/50 rounded-2xl px-5 py-4 font-body-lg text-body-lg text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:ring-4 focus:ring-primary/10 shadow-[0_2px_10px_-4px_rgba(0,0,0,0.05)] transition-all duration-300" id="goal-input" placeholder="Tên món đồ..." type="text"/>
<div class="absolute right-4 top-1/2 -translate-y-1/2 text-outline-variant group-focus-within:text-primary transition-colors pointer-events-none">
<span class="material-symbols-outlined" data-icon="edit">edit</span>
</div>
</div>
</div>
<!-- Numeric Input: Price -->
<div class="flex flex-col gap-2">

<div class="relative group">
<div class="absolute left-5 top-1/2 -translate-y-1/2 flex items-center justify-center">
<span class="font-headline-md text-headline-md text-primary font-semibold">₫</span>
</div>
<input class="w-full bg-surface-container-lowest border border-outline-variant/50 rounded-2xl pl-12 pr-5 py-4 font-headline-lg-mobile text-headline-lg-mobile text-primary placeholder:text-outline-variant focus:outline-none focus:border-primary focus:ring-4 focus:ring-primary/10 shadow-[0_2px_10px_-4px_rgba(0,0,0,0.05)] transition-all duration-300 tracking-tight" id="price-input" placeholder="0" type="number"/>
</div>
</div>
</section>

<button class="w-full bg-primary-container text-on-primary-container font-label-md text-label-md py-4 rounded-full shadow-[0_8px_20px_-8px_rgba(27,67,50,0.5)] hover:shadow-[0_12px_24px_-8px_rgba(27,67,50,0.6)] hover:-translate-y-1 active:translate-y-0 transition-all duration-300 ease-out flex justify-center items-center gap-2 group relative overflow-hidden">
<span class="relative z-10">Tính toán ngay</span>
<span class="material-symbols-outlined relative z-10 group-hover:translate-x-1 transition-transform" data-icon="arrow_forward">arrow_forward</span>
<!-- Subtle hover glow effect -->
<div class="absolute inset-0 bg-white/10 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
</button>

<button class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-xl w-24 py-2 scale-95 transition-all duration-300 ease-out">
<span class="material-symbols-outlined mb-1" data-icon="calculate" data-weight="fill" style="font-variation-settings: 'FILL' 1;">calculate</span>

</button>
<!-- Inactive Tab: Mơ ước -->

<span class="material-symbols-outlined mb-1 group-hover:-translate-y-0.5 transition-transform" data-icon="favorite">favorite</span>
<span class="font-label-sm text-label-sm">Mơ ước</span>
</button>
<!-- Inactive Tab: Ví tiền -->
<button class="flex flex-col items-center justify-center text-on-surface-variant w-24 py-2 hover:text-primary transition-colors group">
<span class="material-symbols-outlined mb-1 group-hover:-translate-y-0.5 transition-transform" data-icon="payments">payments</span>
<span class="font-label-sm text-label-sm">Ví tiền</span>
</button>
</nav>
<!-- Lightweight JS for micro-interactions (Top Bar shadow on scroll) -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const topBar = document.getElementById('top-bar');
            
            window.addEventListener('scroll', () => {
                if (window.scrollY > 10) {
                    topBar.classList.add('shadow-sm', 'border-b', 'border-outline-variant/20');
                } else {
                    topBar.classList.remove('shadow-sm', 'border-b', 'border-outline-variant/20');
                }
            });
        });
    </script>
