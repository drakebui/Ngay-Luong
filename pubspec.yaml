name: ngay_luong
description: "Ngày Lương — quy đổi giá món đồ thành số ngày đi làm trước khi mua."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management (Riverpod + codegen)
  flutter_riverpod: ^2.5.1
  # Be Vietnam Pro gives Vietnamese UI a distinct, rounded sans voice.
  google_fonts: ^6.2.0
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.2.0

  # DB quan hệ (SQLite typed)
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.3
  path: ^1.9.0

  # Secure storage cho thu nhập + app-lock
  flutter_secure_storage: ^9.2.2

  # Settings nhẹ
  shared_preferences: ^2.2.3

  # Notifications
  flutter_local_notifications: ^17.2.1
  timezone: ^0.9.4

  # Ảnh
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0

  # App lock
  local_auth: ^2.2.0

  # Định dạng số/tiền/ngày
  intl: ^0.20.2

  # Tiện ích
  uuid: ^4.4.0
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Codegen
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0
  drift_dev: ^2.18.0
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10

flutter:
  uses-material-design: true
  generate: true
